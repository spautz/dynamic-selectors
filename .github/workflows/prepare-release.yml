name: Prepare Release

on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # pnpm doesn't like the package & branch changes that happen when preparing a release,
  # and `verifyDepsBeforeRun` causes failures. So we'll disable the hooks that activate pnpm.
  HUSKY: 0

jobs:
  prepare-release-pr:
    name: Prepare PR for release
    runs-on: ubuntu-latest
    environment: prepare-release-pr
    # Only run in non-fork repos, on protected default branches.
    if: |
      (! github.event.repository.fork)
        && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        && github.ref_protected
    permissions:
      contents: write # Required to push the release-prep branch back to the repository.
      pull-requests: write # Required to create or update the automated release PR.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/reusable-workflows/setup-repo
        with:
          node-version: nvmrc
          enable-package-manager-cache: false

      - name: Prepare release
        run: pnpm run release:prepare

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh auth setup-git

          git checkout -b prepare-release
          git add --all
          git commit -m "Prepare release (automated)"
          git push origin prepare-release

          gh pr create \
            --head prepare-release \
            --title "Prepare release (automated)" \
            --body ""

          gh pr view prepare-release --json number,url \
            --jq '"Pull Request #\(.number): \(.url)"'
